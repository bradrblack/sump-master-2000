; PlatformIO Project Configuration File
;
; Sump Master 2000. Build with `pio run` (env:sump). Flash over USB with
; `pio run -t upload`, or over Wi-Fi with `pio run -e sump-ota -t upload`.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sump
; The OTA password lives in secrets.ini (git-ignored; copy secrets.ini.example).
; It's used both to build the firmware and to authenticate OTA uploads.
extra_configs = secrets*.ini

[env]
#platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
; Two 1.9 MB app slots for OTA (the default table's 1.25 MB is too tight).
; The partition table can't change over the air: the first flash after
; changing it must be over USB.
board_build.partitions = min_spiffs.csv
build_flags =
    ; enable USB serial
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
upload_speed = 115200
upload_protocol = esptool
lib_deps =
    https://github.com/adafruit/Adafruit_ADXL345.git

; ---- Tunables ---------------------------------------------------------------
; All optional; defaults live in the sketch.
;   ON_RMS_THRESHOLD / OFF_RMS_THRESHOLD  pump vibration thresholds, m/s^2 RMS
;   RUN_CONFIRM_MS / STOP_CONFIRM_MS      continuous vibration/quiet needed to
;                                         start/stop a run
;   SENSOR_TO_FLOOR_CM                    level sensor to the pit floor
;   HIGH_WATER_CM                         high-water alarm, water depth above the floor
;   HIGH_WATER_HYST_CM                    how far it must drop to clear the alarm
;   MIN_DROP_CM                           a pump run should lower the level by at least this
; Calibrate the vibration thresholds from the rms= values printed over serial
; while the pump is idle and running. The pit numbers are placeholders until
; the sensor is mounted: the firmware logs the level at every pump start and
; stop, so the pump's normal on/off levels can be read from the first few cycles.

[env:sump]
build_flags =
    ${env.build_flags}
    -DDEVICE_NAME=\"sump\"
    -DOTA_PASSWORD=\"${secrets.ota_password}\"
    -DON_RMS_THRESHOLD=0.40f
    -DOFF_RMS_THRESHOLD=0.20f
    -DRUN_CONFIRM_MS=3000UL
    -DSTOP_CONFIRM_MS=3000UL
    -DSENSOR_TO_FLOOR_CM=95.0f
    -DHIGH_WATER_CM=45.0f
    -DHIGH_WATER_HYST_CM=5.0f
    -DMIN_DROP_CM=5.0f

; Same firmware, uploaded over Wi-Fi with ArduinoOTA. The board must be powered,
; on the network, and idle (it doesn't accept updates while the pump runs).
[env:sump-ota]
extends = env:sump
upload_protocol = espota
upload_port = sm2k.local
upload_flags =
    --auth=${secrets.ota_password}
