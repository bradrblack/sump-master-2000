# Drop-in Telegraf config: Sump Master 2000 -> InfluxDB 2.x.
#
# Install on the InfluxDB host as /etc/telegraf/telegraf.d/sump.conf (adjust
# for your OS), put the variables from sump.env.example in Telegraf's
# environment file, then restart Telegraf.
#
# The board POSTs InfluxDB line protocol, already timestamped by its own
# NTP-synced clock, to http://<this host>:8186/sump. Telegraf passes it
# straight through. Measurements (all tagged device=sump):
#   sump        every 10 min: level_cm, distance_cm, level_status, temp_c,
#               humidity, running, cycles, run_s (for the period), rssi, heap
#   sump_event  pump start/stop as it happens: event, running, seconds (stop),
#               level_cm (start); note="restart" on a correction after a reboot
#   sump_cycle  after each run: seconds, level_before_cm, level_after_cm,
#               drop_cm, result ("ok", "no_drop", "unverified")
#   sump_alarm  high water on/off: type, active, level_cm
#   sump_boot   each boot: version, reason

[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/sump"]
  methods = ["POST"]
  data_format = "influx"
  # The listener is unauthenticated, so anything on the LAN can write to it.
  # To require a password, set these and put the same credentials in the
  # board's TELEGRAF_URL (http://user:pass@host:8186/sump).
  # basic_username = "${SUMP_HTTP_USER}"
  # basic_password = "${SUMP_HTTP_PASS}"

# namepass keeps this from also receiving (or duplicating) metrics from other
# inputs in your main telegraf.conf.
[[outputs.influxdb_v2]]
  namepass = ["sump", "sump_*"]
  urls = ["http://192.168.3.252:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
